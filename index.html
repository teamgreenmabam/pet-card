<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 아이 카드 만들기</title>
<style>
  :root{
    --green:#5bc45b;
    --light-green:#dff3c8;
    --brown:#9b6b59;
    --yellow:#ffd23f;
    --bg:#f7f8f4;
    --text:#263326;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{width:min(1100px,100%);margin:0 auto;padding:24px}
  h1{text-align:center;margin:0 0 8px;font-size:clamp(28px,5vw,44px)}
  .sub{text-align:center;color:#6f786b;margin:0 0 26px}
  .grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:26px;align-items:start}
  .panel{background:#fff;border-radius:22px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.07)}
  label{display:block;margin:16px 0 7px;font-weight:800}
  input,select{width:100%;padding:13px 14px;border:1px solid #d9ddd5;border-radius:12px;background:#fff;font-size:16px}
  input[type="file"]{padding:10px}
  input[type="range"]{padding:0}
  .btn{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;cursor:pointer;margin-top:18px}
  .primary{background:#4a9d4a;color:white}
  .secondary{background:#f6c93d;color:#2c4a2c}
  .canvas-wrap{display:flex;justify-content:center;flex-direction:column;align-items:center}
  canvas{width:min(100%,560px);height:auto;background:white;box-shadow:0 10px 30px rgba(0,0,0,.08);touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .note{margin-top:12px;color:#7d8578;font-size:13px;line-height:1.5}
  .tip{
    margin:0 0 12px;
    width:min(100%,560px);
    background:#eef8e8;
    border:1px solid #cfe8c7;
    color:#496047;
    border-radius:12px;
    padding:10px 12px;
    font-size:14px;
    line-height:1.5;
  }
  .range-row{display:flex;align-items:center;gap:10px}
  .range-row span{min-width:48px;text-align:right;color:#687065;font-weight:700}
  @media(max-width:820px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:14px}
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>🐾 우리 아이 카드 만들기</h1>
  <p class="sub">사진과 정보를 입력하면 세로형 프로필 카드가 자동으로 만들어져요.</p>

  <div class="grid">
    <section class="panel">
      <label for="photo">사진</label>
      <input id="photo" type="file" accept="image/*">

      <label for="zoom">사진 확대/축소</label>
      <div class="range-row">
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1">
        <span id="zoomValue">100%</span>
      </div>

      <button id="resetPhotoBtn" class="btn" style="background:#eef3ea;color:#40513f;margin-top:10px;">사진 위치 초기화</button>

      <label for="name">이름</label>
      <input id="name" type="text" value="버니" placeholder="예: 버니" maxlength="10">

      <label for="gender">성별</label>
      <select id="gender">
        <option value="♂">♂ 수컷</option>
        <option value="♀" selected>♀ 암컷</option>
        <option value="?">? 모름/미정</option>
      </select>

      <label for="species">종류</label>
      <input id="species" type="text" value="크레스티드 게코" placeholder="예: 크레스티드 게코" maxlength="24">

      <label for="birthday">생일</label>
      <input id="birthday" type="text" value="24.08.23" placeholder="예: 24.08.23" maxlength="16">

      <label for="adoption">입양일</label>
      <input id="adoption" type="text" value="25.06.29" placeholder="예: 25.06.29" maxlength="16">

      <button id="makeBtn" class="btn primary">✨ 카드 만들기</button>
      <button id="downloadBtn" class="btn secondary">이미지 저장하기</button>

      <p class="note">사진은 서버에 저장하지 않고 현재 브라우저 안에서만 사용됩니다.</p>
    </section>

    <section class="panel canvas-wrap">
      <div class="tip">사진을 넣은 뒤, <b>원형 사진 안을 마우스나 손가락으로 끌어서 위치를 옮길 수 있어요.</b> 확대/축소는 왼쪽 슬라이더로 조절하세요.</div>
      <canvas id="card" width="520" height="780"></canvas>
    </section>
  </div>
</main>

<script>
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');

const photoInput = document.getElementById('photo');
const nameInput = document.getElementById('name');
const genderInput = document.getElementById('gender');
const speciesInput = document.getElementById('species');
const birthdayInput = document.getElementById('birthday');
const adoptionInput = document.getElementById('adoption');
const zoomInput = document.getElementById('zoom');
const zoomValue = document.getElementById('zoomValue');

let petImage = null;
let photoOffsetX = 0;
let photoOffsetY = 0;
let zoom = 1;

const photoCircle = { cx:260, cy:290, r:148 };

function getBaseCoverSize(img, w, h){
  const ir = img.width / img.height;
  const rr = w / h;
  let drawW, drawH;
  if(ir > rr){
    drawH = h;
    drawW = h * ir;
  }else{
    drawW = w;
    drawH = w / ir;
  }
  return {drawW, drawH};
}

function drawPhotoInCircle(){
  const {cx, cy, r} = photoCircle;
  const size = r*2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.clip();

  if(petImage){
    const base = getBaseCoverSize(petImage, size, size);
    const drawW = base.drawW * zoom;
    const drawH = base.drawH * zoom;
    const x = cx - drawW/2 + photoOffsetX;
    const y = cy - drawH/2 + photoOffsetY;
    ctx.drawImage(petImage, x, y, drawW, drawH);
  }else{
    ctx.fillStyle='#ecefe9';
    ctx.fillRect(cx-r,cy-r,size,size);
    ctx.fillStyle='#98a090';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font='700 24px Arial';
    ctx.fillText('사진을 넣어주세요',cx,cy);
  }

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='#58c957';
  ctx.lineWidth=6;
  ctx.stroke();
}

function fitText(text, maxWidth, startSize, minSize, weight='800'){
  let size = startSize;
  while(size > minSize){
    ctx.font = `${weight} ${size}px Arial`;
    if(ctx.measureText(text).width <= maxWidth) break;
    size--;
  }
  return size;
}

function drawLoop(x,y,scale=1){
  ctx.save();
  ctx.strokeStyle='#9bd87f';
  ctx.lineWidth=4*scale;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.bezierCurveTo(x-35*scale,y+35*scale,x+10*scale,y+55*scale,x+30*scale,y+18*scale);
  ctx.bezierCurveTo(x+45*scale,y-10*scale,x+20*scale,y-25*scale,x-5*scale,y-5*scale);
  ctx.stroke();
  ctx.restore();
}

function drawSpark(x,y,scale=1){
  ctx.save();
  ctx.fillStyle='#ffd23f';
  ctx.translate(x,y);
  ctx.rotate(-0.15);
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4;
    const r = i%2===0 ? 18*scale : 7*scale;
    const px = Math.cos(a)*r;
    const py = Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawLeaf(x,y,flip=false){
  ctx.save();
  ctx.translate(x,y);
  if(flip) ctx.scale(-1,1);
  ctx.fillStyle='#9bd87f';
  ctx.beginPath();
  ctx.ellipse(-8,0,8,18,-0.7,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(8,5,8,18,0.7,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawCard(){
  const name = nameInput.value.trim() || '이름';
  const gender = genderInput.value;
  const species = speciesInput.value.trim() || '종류';
  const birthday = birthdayInput.value.trim() || '--.--.--';
  const adoption = adoptionInput.value.trim() || '--.--.--';

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,520,780);

  ctx.strokeStyle='#8fd781';
  ctx.lineWidth=4;
  ctx.strokeRect(25,25,450,730);

  drawLoop(105,55,1.0);
  drawSpark(190,110,0.8);
  drawSpark(395,120,0.7);

  ctx.save();
  ctx.strokeStyle='#ffd23f';
  ctx.lineWidth=8;
  ctx.lineCap='round';
  [[390,85,400,68],[412,99,427,86],[425,120,445,116]].forEach(a=>{
    ctx.beginPath();
    ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.stroke();
  });
  ctx.restore();

  drawPhotoInCircle();

  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='#58c957';
  const spSize=fitText(species,300,28,18);
  ctx.font=`800 ${spSize}px Arial`;
  ctx.fillText(species,260,505);

  const nameText=name+' '+gender;
  const nameSize=fitText(nameText,250,58,34);
  ctx.font=`900 ${nameSize}px Arial`;
  const nameWidth=ctx.measureText(nameText).width;
  const boxW=Math.max(180,nameWidth+34);

  ctx.fillStyle='#e3f4c8';
  ctx.beginPath();
  const bx=260-boxW/2, by=520, bh=72, br=18;
  ctx.roundRect(bx,by,boxW,bh,br);
  ctx.fill();

  ctx.fillStyle='#9c6b59';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font=`900 ${nameSize}px Arial`;
  ctx.fillText(name,260-(ctx.measureText(gender).width/2+5),556);

  const nameOnlyW=ctx.measureText(name).width;
  const genderX=260 + nameOnlyW/2 + 8;
  ctx.fillStyle = gender==='♀' ? '#58c957' : gender==='♂' ? '#4d88d8' : '#6f756e';
  ctx.font=`900 ${nameSize}px Arial`;
  ctx.fillText(gender,genderX,556);

  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.font='800 27px Arial';
  ctx.fillStyle='#9c6b59';
  ctx.fillText('생일:',165,635);
  ctx.fillText('입양:',165,675);
  ctx.fillText(birthday,235,635);
  ctx.fillText(adoption,235,675);

  drawLeaf(410,645,false);
  drawLeaf(400,690,true);
  drawLoop(420,715,1.2);

  ctx.save();
  ctx.strokeStyle='#9bd87f';
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(305,780);
  ctx.bezierCurveTo(330,715,395,665,520,665);
  ctx.stroke();
  ctx.restore();
}

photoInput.addEventListener('change', e=>{
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      petImage=img;
      photoOffsetX=0;
      photoOffsetY=0;
      zoom=1;
      zoomInput.value='1';
      zoomValue.textContent='100%';
      drawCard();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

zoomInput.addEventListener('input', ()=>{
  zoom = parseFloat(zoomInput.value);
  zoomValue.textContent = Math.round(zoom*100) + '%';
  drawCard();
});

document.getElementById('resetPhotoBtn').addEventListener('click', ()=>{
  photoOffsetX=0;
  photoOffsetY=0;
  zoom=1;
  zoomInput.value='1';
  zoomValue.textContent='100%';
  drawCard();
});

[nameInput,genderInput,speciesInput,birthdayInput,adoptionInput].forEach(el=>{
  el.addEventListener('input',drawCard);
  el.addEventListener('change',drawCard);
});

document.getElementById('makeBtn').addEventListener('click',drawCard);

document.getElementById('downloadBtn').addEventListener('click',()=>{
  drawCard();
  const safe=(nameInput.value.trim()||'pet-card').replace(/[\\/:*?"<>|]/g,'_');
  const a=document.createElement('a');
  a.download=safe+'_card.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
});

function pointerToCanvas(e){
  const rect=canvas.getBoundingClientRect();
  const clientX=e.touches ? e.touches[0].clientX : e.clientX;
  const clientY=e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x:(clientX-rect.left)*(canvas.width/rect.width),
    y:(clientY-rect.top)*(canvas.height/rect.height)
  };
}

function insidePhotoCircle(p){
  const dx=p.x-photoCircle.cx;
  const dy=p.y-photoCircle.cy;
  return dx*dx+dy*dy <= photoCircle.r*photoCircle.r;
}

let dragging=false;
let lastPoint=null;

function startDrag(e){
  if(!petImage) return;
  const p=pointerToCanvas(e);
  if(!insidePhotoCircle(p)) return;
  dragging=true;
  lastPoint=p;
  canvas.classList.add('dragging');
  e.preventDefault();
}

function moveDrag(e){
  if(!dragging) return;
  const p=pointerToCanvas(e);
  photoOffsetX += p.x-lastPoint.x;
  photoOffsetY += p.y-lastPoint.y;
  lastPoint=p;
  drawCard();
  e.preventDefault();
}

function endDrag(){
  dragging=false;
  lastPoint=null;
  canvas.classList.remove('dragging');
}

canvas.addEventListener('mousedown',startDrag);
window.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);

canvas.addEventListener('touchstart',startDrag,{passive:false});
canvas.addEventListener('touchmove',moveDrag,{passive:false});
window.addEventListener('touchend',endDrag);

drawCard();
</script>
</body>
</html>
