<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 아이 카드 만들기</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4f0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .description {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .box {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #preview {
      margin-top: 30px;
      text-align: center;
    }

    #preview img {
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🐾 우리 아이 카드 만들기</h1>

    <p class="description">
      사진과 정보를 입력해보세요.
    </p>

    <div class="box">

      <label>사진</label>
      <input type="file" id="photo" accept="image/*">

      <label>이름</label>
      <input type="text" id="name" placeholder="예: 깜순">

      <label>생일</label>
      <input type="text" id="birthday" placeholder="예: 2024.12.31">

      <label>입양일</label>
      <input type="text" id="adoption" placeholder="예: 2025.06.29">

      <button onclick="makeCard()">
        ✨ 카드 만들기
      </button>

      <div id="preview"></div>

    </div>

  </div>

<script>
function makeCard() {
  const photo = document.getElementById("photo").files[0];
  const name = document.getElementById("name").value;
  const birthday = document.getElementById("birthday").value;
  const adoption = document.getElementById("adoption").value;

  if (!photo) {
    alert("사진을 선택해주세요.");
    return;
  }

  if (!name) {
    alert("이름을 입력해주세요.");
    return;
  }

  const imageURL = URL.createObjectURL(photo);

  document.getElementById("preview").innerHTML = `
    <h2>완성되었습니다! 🎉</h2>
    <img src="${imageURL}">
    <p><strong>${name}</strong></p>
    <p>생일: ${birthday}</p>
    <p>입양: ${adoption}</p>
  `;
}
</script>

</body>
</html>
